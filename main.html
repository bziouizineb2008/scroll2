<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scroll web</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: transparent !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: none !important;
            color: #fff;
            z-index: 1000;
        }
        header nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }
        header nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }
        header nav ul li a:hover {
            opacity: 0.7;
        }
        main {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(0, 70, 50, 0.4), rgba(0, 50, 40, 0.6)), url('img.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }
        .container {
            max-width: 800px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .container h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 3px;
        }
        .container p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            color: #e0e0e0;
        }
        .container button {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 30px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .container button:hover {
            background: #fff;
            color: #000;
        }
        .home, .about, .services, .contact {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            background-color: #f4f4f4;
            border-bottom: 1px solid #ddd;
        }
        .about { background-color: #eaeaea; }
        .services { background-color: #f4f4f4; }
        .contact { background-color: #eaeaea; }
    </style>
</head>
<body>
    <header>
        <h1><!-- logo --></h1>
        <nav>
            <ul>
                <li><a onclick="homePage()" href="#home">Home</a></li>
                <li><a onclick="aboutPage()" href="#about">About</a></li>
                <li><a onclick="servicesPage()" href="#services">Services</a></li>
                <li><a onclick="contactPage()" href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h1>SCROLL PROJECT</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.<br>
                Porro rem atque ad provident perferendis veritatis! </p>
            <button type="button" aria-label="Learn more">EXPLORE TOURS</button>
        </div>
    </main>
    <div class="home">
        <h1>HOME</h1>
    </div>
    <div class="about">
        <h1>ABOUT</h1>
    </div>
    <div class="services">
        <h1>SERVICES</h1>
    </div>
    <div class="contact">
        <h1>CONTACT</h1>
    </div>
    <script>
        document.querySelector('.container button').addEventListener('click', () => {
    document.querySelector('.home').scrollIntoView({ behavior: 'smooth' });
});
        document.querySelectorAll('header nav a').forEach(link => {
    link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetClass = link.textContent.trim().toLowerCase();
        const targetElement = document.querySelector('.' + targetClass);
        
        if (targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth' });
        }
    });
});
    </script>
</body>
</html>
